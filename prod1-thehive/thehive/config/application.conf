# SECRET CONFIGURATION
include "/etc/thehive/secret.conf"

# DATABASE CONFIGURATION
db.janusgraph.storage {
  backend = cql
  hostname = ["cassandra"]
  cql {
    cluster-name = thp
    keyspace = thehive
  }
}

# INDEX DATABASE CONFIGURATION
include "/etc/thehive/index.conf"

# ATTACHMENTS STORAGE CONFIGURATION
storage {
  ## Local filesystem
  provider: localfs
  localfs {
    location: /opt/thp/thehive/files
  }
}

# SERVICE CONFIGURATION
stream.longPolling.refresh: 45 seconds
play.http.context : "/"
play.http.parser.maxDiskBuffer: 1GB
play.http.parser.maxMemoryBuffer: 256kB
### Stream configuration
stream {
  get {
    maxAttempts = 5
    minBackoff = 100 milliseconds
    maxBackoff = 500 milliseconds
    randomFactor = 0.2
  }
}


# CONNECTORS
# Enable Cortex connector
scalligraph.modules += org.thp.thehive.connector.cortex.CortexModule
# Enable MISP connector
scalligraph.modules += org.thp.thehive.connector.misp.MispModule
# Enable TheHive Flow connector (TheHive 6):
# 1. Create thehive/config/flow.conf, readable by its owner only (chmod 600) and never committed:
#    it holds the JWT signing key. Put the following lines in it:
#      flow.url = "https://<flow_host>/"
#      flow.jwt_signing_key = "<jwt_signing_key>"
#      features.Orchestrator.enabled = true
#      scalligraph.modules += org.thp.thehive.connector.flow.FlowModule
#    flow.url: nginx address of TheHive Flow host, matching its TLS certificate. The address TheHive
#    calls from must be in nginx_thehive_addresses of TheHive Flow .env file, otherwise nginx returns 403.
#    flow.jwt_signing_key: jwt_signing_key value of TheHive Flow .env file.
# 2. With the self-signed certificate of TheHive Flow, also add to flow.conf:
#      flow.wsConfig.ssl.trustManager.stores = [{ type: "PEM", path: "/etc/thehive/thehive-flow-nginx.crt" }]
#    and copy nginx/certs/server.crt of TheHive Flow host to thehive/config/thehive-flow-nginx.crt.
#    INSECURE alternative, for test environments only: flow.wsConfig.ssl.loose.acceptAnyCertificate = true
#    disables certificate verification of TheHive Flow.
# 3. Uncomment the line below, then restart TheHive:
#include required("/etc/thehive/flow.conf")
